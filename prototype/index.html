<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="VitalCheck prototype: a privacy-first health-habit app for BP, glucose, labs and a daily plan. For awareness only; not a medical device.">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>VitalCheck Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout concept: one phone-width column with a fixed bottom tab bar. Two looks share one component tree:
   "simple" = flat, high contrast, quiet; "realistic" = frosted glass, gradient mesh, instrument-style gauges.
   Look is set as data-look on :root; light/dark follows the viewer. Tokens: ground, ink, one teal accent,
   four severity colours kept separate from the accent, and a second chart colour. Type: Figtree for text, Sora for numerals in the realistic look. */
:root{
  --bg:#f3f6f5; --mesh:none; --fg:#10201d; --muted:#4f625e; --card:#ffffff; --line:#d5dfdc;
  --shadow:none; --blur:0px; --radius:12px; --accent:#0f766e; --accent-fg:#ffffff; --accent-soft:#dcefeb;
  --nav:#ffffff; --input:#ffffff; --track:#e2eae8; --lcd-bg:#0e2a2d; --lcd-fg:#8ff7dc;
  --ok:#146c43; --ok-bg:#dcf2e5; --watch:#7a5200; --watch-bg:#fbeecb; --high:#a8420a; --high-bg:#fde2cf;
  --crit:#a1112a; --crit-bg:#fbd9df; --info:#27454a; --info-bg:#e3eceb;
  --c1:#0f766e; --c2:#3a62a7;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --font-num:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1917; --fg:#e4f0ed; --muted:#9db3ae; --card:#14231f; --line:#27403a; --accent:#45c7b8; --accent-fg:#06211d;
    --accent-soft:#17352f; --nav:#14231f; --input:#101e1b; --track:#223632; --lcd-bg:#061a1c; --lcd-fg:#8ff7dc;
    --ok:#6fdc9d; --ok-bg:#133424; --watch:#f2c35a; --watch-bg:#392b0a; --high:#ffa066; --high-bg:#3d1f0e;
    --crit:#ff8a9a; --crit-bg:#401220; --info:#b8d4cf; --info-bg:#1b302c; --c1:#45c7b8; --c2:#8db4ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1917; --fg:#e4f0ed; --muted:#9db3ae; --card:#14231f; --line:#27403a; --accent:#45c7b8; --accent-fg:#06211d;
  --accent-soft:#17352f; --nav:#14231f; --input:#101e1b; --track:#223632; --lcd-bg:#061a1c; --lcd-fg:#8ff7dc;
  --ok:#6fdc9d; --ok-bg:#133424; --watch:#f2c35a; --watch-bg:#392b0a; --high:#ffa066; --high-bg:#3d1f0e;
  --crit:#ff8a9a; --crit-bg:#401220; --info:#b8d4cf; --info-bg:#1b302c; --c1:#45c7b8; --c2:#8db4ff; color-scheme:dark;
}
/* realistic look, light */
:root[data-look="realistic"]{
  --bg:#eaf0f3;
  --mesh:radial-gradient(60% 40% at 12% 0%,rgba(14,143,134,.24),transparent 70%),radial-gradient(50% 40% at 100% 18%,rgba(99,102,241,.15),transparent 70%),radial-gradient(60% 50% at 45% 100%,rgba(14,143,134,.14),transparent 70%);
  --card:rgba(255,255,255,.66); --line:rgba(255,255,255,.85);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 14px 32px -14px rgba(16,32,45,.30),0 2px 6px rgba(16,32,45,.06);
  --blur:18px; --radius:24px; --accent:#0b8a80; --accent-fg:#ffffff; --accent-soft:rgba(11,138,128,.14);
  --fg:#0f1f2b; --muted:#465a68; --nav:rgba(255,255,255,.78); --input:rgba(255,255,255,.85); --track:rgba(15,31,43,.12);
  --font-num:'Sora','Figtree',system-ui,sans-serif;
}
/* realistic look, dark */
@media (prefers-color-scheme: dark){
  :root[data-look="realistic"]:not([data-theme="light"]){
    --bg:#080f22;
    --mesh:radial-gradient(60% 40% at 10% 0%,rgba(20,184,166,.30),transparent 70%),radial-gradient(55% 45% at 100% 25%,rgba(124,92,255,.28),transparent 70%),radial-gradient(70% 50% at 40% 100%,rgba(20,184,166,.18),transparent 70%);
    --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
    --shadow:0 1px 0 rgba(255,255,255,.12) inset,0 18px 40px -16px rgba(0,0,0,.7);
    --accent:#4fe0cf; --accent-fg:#031a18; --accent-soft:rgba(79,224,207,.16); --fg:#e8f1f8; --muted:#9db0c0;
    --nav:rgba(12,20,40,.82); --input:rgba(255,255,255,.08); --track:rgba(255,255,255,.14);
  }
}
:root[data-look="realistic"][data-theme="dark"]{
  --bg:#080f22;
  --mesh:radial-gradient(60% 40% at 10% 0%,rgba(20,184,166,.30),transparent 70%),radial-gradient(55% 45% at 100% 25%,rgba(124,92,255,.28),transparent 70%),radial-gradient(70% 50% at 40% 100%,rgba(20,184,166,.18),transparent 70%);
  --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --shadow:0 1px 0 rgba(255,255,255,.12) inset,0 18px 40px -16px rgba(0,0,0,.7);
  --accent:#4fe0cf; --accent-fg:#031a18; --accent-soft:rgba(79,224,207,.16); --fg:#e8f1f8; --muted:#9db0c0;
  --nav:rgba(12,20,40,.82); --input:rgba(255,255,255,.08); --track:rgba(255,255,255,.14);
}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--mesh);background-attachment:fixed;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.shell{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;margin-inline:-16px;padding-inline:16px;background:var(--nav);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;letter-spacing:.01em}
.brand span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lookbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:13px}
.lookbtn i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--c2));display:inline-block}
#view{display:flex;flex-direction:column;gap:16px;padding-top:16px;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));padding:16px;min-width:0}
.card h2{font-size:16px;margin-bottom:10px}
.card h3{font-size:14px;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.01em}
.btn{min-height:44px;padding:0 16px;border-radius:calc(var(--radius) - 2px);border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn[disabled]{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
input,select{min-height:44px;padding:0 12px;border-radius:calc(var(--radius) - 2px);border:1px solid var(--line);background:var(--input);width:100%;min-width:0}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
.check{flex-direction:row;align-items:center;gap:10px;font-weight:500;font-size:14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:calc(var(--radius) + 2px);background:var(--track);overflow-x:auto}
.seg button{flex:1;min-height:38px;padding:0 12px;border:0;border-radius:calc(var(--radius) - 2px);background:transparent;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:var(--shadow);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip span{font-size:11px}
.t-normal{background:var(--ok-bg);color:var(--ok)}
.t-watch{background:var(--watch-bg);color:var(--watch)}
.t-high{background:var(--high-bg);color:var(--high)}
.t-veryHigh,.t-urgent{background:var(--crit-bg);color:var(--crit)}
.t-info{background:var(--info-bg);color:var(--info)}
.flag{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:calc(var(--radius) - 2px);border:1px solid var(--line);background:var(--input)}
.flag.urgent{border:2px solid var(--crit)}
.flag p{font-size:14px}
.note{font-size:13px;color:var(--high);font-weight:600}
.sample{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:var(--radius);background:var(--info-bg);color:var(--info);font-size:13px}
/* score */
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid b{font-size:30px;line-height:1}
.ring .mid span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.track{stroke:var(--track)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.legend div{display:flex;justify-content:space-between;gap:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
:root[data-look="simple"] .real-only,:root:not([data-look="realistic"]) .real-only{display:none}
:root[data-look="realistic"] .simple-only{display:none}
:root[data-look="realistic"] .ring svg .glow{filter:drop-shadow(0 0 5px var(--accent))}
/* readings */
.read .big{font-size:34px;line-height:1.1}
.read .unit{font-size:12px;color:var(--muted)}
.dial{width:100%;max-width:230px;margin-inline:auto;display:block}
.needle{transform-box:view-box;transform-origin:110px 110px;transition:transform 1.1s cubic-bezier(.2,.9,.25,1.1)}
.lcd{background:var(--lcd-bg);color:var(--lcd-fg);border-radius:16px;padding:14px;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 2px 10px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.2);text-align:right}
.lcd b{font-family:var(--font-num);font-size:44px;line-height:1;text-shadow:0 0 12px var(--lcd-fg);letter-spacing:.02em}
.lcd small{display:block;opacity:.8;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .l1{stroke:var(--c1);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .l2{stroke:var(--c2);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 0}
.chart .p1{fill:var(--c1)}
.chart .p2{fill:var(--c2)}
.chart .area{fill:var(--c1);opacity:.12}
:root[data-look="realistic"] .chart .l1{filter:drop-shadow(0 0 4px var(--c1))}
/* list rows */
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{min-width:0}
.item .t b{display:block;overflow-wrap:anywhere}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.time{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600;width:58px;flex:none}
/* nav, banners, toast, gate */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nav);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;border-radius:12px}
.tabs button[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
#banners{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:25;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.banner{padding:14px;border-radius:var(--radius);background:var(--card);border:2px solid var(--accent);box-shadow:var(--shadow);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.banner p{font-weight:600;margin-bottom:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;max-width:min(440px,calc(100% - 32px));padding:12px 16px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px}
.gate{max-width:480px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:16px}
.gate h1{font-size:26px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.src{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.hero{flex-direction:column;align-items:flex-start}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="app">
  <div id="gate" class="gate" hidden></div>
  <div class="shell" id="shell" hidden>
    <header class="top">
      <div class="brand"><b>VitalCheck</b><span>Preview, awareness only</span></div>
      <button class="lookbtn" id="lookbtn" data-act="toggleLook" aria-label="Switch look between Simple and Realistic"><i></i><span id="lookname">Simple</span></button>
    </header>
    <div id="banners" aria-live="assertive"></div>
    <main id="view" tabindex="-1"></main>
  </div>
  <nav class="tabs" id="tabs" aria-label="Main" hidden></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<script>
(function(){
'use strict';
// ENGINE START
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hhmm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const TIERS=['normal','watch','high','veryHigh','urgent'];
const maxTier=(a,b)=>TIERS.indexOf(a)>=TIERS.indexOf(b)?a:b;
const TIER_LABEL={normal:'Normal',watch:'Elevated',high:'High',veryHigh:'Very high',urgent:'Urgent',info:'Note'};
const TIER_ICON={normal:'✓',watch:'▲',high:'◆',veryHigh:'■',urgent:'!',info:'i'};
const CTX_LABEL={fasting:'fasting',post:'2-hour post-meal',bedtime:'bedtime',random:'random'};
const DISC='For awareness only, not a diagnosis. Please consult your doctor.';

function bpTier(s,d){
  const ts=s>=140?'veryHigh':s>=130?'high':s>=120?'watch':'normal';
  const td=d>=90?'veryHigh':d>=80?'high':'normal';
  return maxTier(ts,td);
}
const bpUrgent=(s,d)=>s>=180||d>=120;
function glucoseTier(ctx,v){
  if(v<70||v>=300) return 'urgent';
  if(ctx==='fasting') return v>=126?'high':v>=100?'watch':'normal';
  if(ctx==='bedtime') return v>180?'high':(v<100||v>140)?'watch':'normal';
  return v>=200?'high':v>=140?'watch':'normal';
}
const TESTS=[
  {key:'HbA1c',name:'HbA1c',unit:'%'},{key:'FBS',name:'Fasting glucose',unit:'mg/dL'},{key:'PPBS',name:'Post-meal glucose (2 h)',unit:'mg/dL'},
  {key:'LDL',name:'LDL cholesterol',unit:'mg/dL'},{key:'HDL',name:'HDL cholesterol',unit:'mg/dL'},{key:'TG',name:'Triglycerides',unit:'mg/dL'},
  {key:'creatinine',name:'Creatinine',unit:'mg/dL'},{key:'tsh',name:'TSH',unit:'mIU/L'},{key:'hb',name:'Haemoglobin',unit:'g/dL'},
  {key:'vitd',name:'Vitamin D',unit:'ng/mL'},{key:'b12',name:'Vitamin B12',unit:'pg/mL'},{key:'alt',name:'ALT (SGPT)',unit:'U/L'}
];
const DOCTOR_ONLY=['creatinine','tsh','hb','vitd','b12','alt'];
function classifyLab(key,value,ref){
  const R=(band,label,range)=>({band,label,range});
  if(key==='HbA1c') return value>=6.5?R('diabetes','diabetes range','6.5% or higher'):value>=5.7?R('pre','prediabetes range','5.7 to 6.4%'):R('normal','normal range','below 5.7%');
  if(key==='FBS') return value>=126?R('diabetes','diabetes range','126 mg/dL or higher'):value>=100?R('pre','prediabetes range','100 to 125 mg/dL'):R('normal','normal range','below 100 mg/dL');
  if(key==='PPBS') return value>=200?R('diabetes','diabetes range','200 mg/dL or higher'):value>=140?R('pre','prediabetes range','140 to 199 mg/dL'):R('normal','normal range','below 140 mg/dL');
  const lo=ref&&ref.refLo!=null&&ref.refLo!==''?Number(ref.refLo):null;
  const hi=ref&&ref.refHi!=null&&ref.refHi!==''?Number(ref.refHi):null;
  if(lo!==null&&!isNaN(lo)&&value<lo) return R('below','below the range printed on your report','');
  if(hi!==null&&!isNaN(hi)&&value>hi) return R('above','above the range printed on your report','');
  if((lo!==null&&!isNaN(lo))||(hi!==null&&!isNaN(hi))) return R('within','within the range printed on your report','');
  return R('none','','');
}
function labMessage(l,profile){
  const t=TESTS.find(x=>x.key===l.key)||{name:l.key,unit:''};
  const c=classifyLab(l.key,l.value,l);
  const val=l.key==='HbA1c'?Number(l.value).toFixed(1):l.value;
  const v=val+(t.unit==='%'?'%':' '+t.unit);
  if(['HbA1c','FBS','PPBS'].includes(l.key)){
    if(profile.hasDiabetes) return {tier:'info',text:'Saved. This result is added to your trend so you can share it with your doctor.'};
    if(c.band==='pre') return {tier:'watch',text:'Your '+t.name+' of '+v+' is in the range guidelines call the prediabetes range ('+c.range+'). '+DISC};
    if(c.band==='diabetes') return {tier:'high',text:'Your '+t.name+' of '+v+' is in the range guidelines call the diabetes range ('+c.range+'). Only a doctor can confirm what this means. Please consult your doctor soon. For awareness only, not a diagnosis.'};
    return {tier:'normal',text:'Your '+t.name+' of '+v+' is in the usual reference range ('+c.range+'). For awareness only.'};
  }
  if(c.band==='none') return {tier:'info',text:'Saved. Add the range printed on your report to see where this value sits. Please discuss it with your doctor.'};
  if(c.band==='within') return {tier:'normal',text:'Your '+t.name+' of '+v+' is '+c.label+'. For awareness only.'};
  return {tier:'watch',text:'Your '+t.name+' of '+v+' is '+c.label+'. '+DISC};
}
const CARDS={
  keep:{title:'Looking steady',text:'This value is within the reference range. Regular movement, a balanced plate and low added sugar are commonly suggested to keep it that way. Ask your doctor how often to re-test.',src:'General public-health guidance'},
  move:{title:'Keep moving',text:'Many guidelines suggest about 150 minutes of moderate activity a week, for example a brisk 30 to 45 minute walk on most days. Start smaller if you are new to exercise.',src:'WHO 2020 physical activity guidelines; ADA Standards of Care 2026',plan:{kind:'walk',title:'Brisk walk, 30 minutes',time:'06:30'}},
  after:{title:'A short walk after meals',text:'A few minutes of light walking after meals is linked to smoother after-meal sugar curves. The evidence comes from small studies, mostly in people without diabetes.',src:'Meta-analysis of 7 studies (Sports Medicine)',plan:{kind:'walk',title:'10-minute walk after lunch',time:'14:00'}},
  drinks:{title:'Skip sugary drinks',text:'Soft drinks, packaged juices, sweetened tea or coffee and sharbat add sugar quickly. Water or unsweetened drinks are a gentler choice. ICMR-NIN suggests keeping added sugar under 5% of daily energy, about 25 to 30 g.',src:'ICMR-NIN Dietary Guidelines for Indians 2024'},
  plate:{title:'Fill half your plate with vegetables',text:'Vegetables, fruit and leafy greens make up roughly half the plate. Prefer whole grains and pulses, and have fewer packaged and fried snacks. Reading food labels helps.',src:'ICMR-NIN Dietary Guidelines for Indians 2024'},
  salt:{title:'Go easy on salt',text:'Under 5 g of salt a day, about one teaspoon. Watch pickles, papad, namkeen and packaged snacks.',src:'WHO salt reduction fact sheet'},
  sleep:{title:'Sleep and sitting',text:'Regular sleep of about 7 to 9 hours, and a little movement instead of long stretches of sitting.',src:'WHO 2020 (sitting); general public-health guidance (sleep)'},

function buildFlags(S,now){

    const s=Math.round(avg(bp7.map(r=>r.s))),d=Math.round(avg(bp7.map(r=>r.d))),t=bpTier(s,d);
    flags.push({tier:t,title:'Blood pressure, 7-day average',text:t==='normal'?'Your 7-day average is '+s+'/'+d+' mmHg, in the usual reference band. Keep logging to see your pattern.':'Your 7-day average is '+s+'/'+d+' mmHg, in the '+TIER_LABEL[t].toLowerCase()+' reference band. '+DISC});
  } else if(bp7.length>0){
    flags.push({tier:'info',title:'Blood pressure',text:'Log a few more readings to see a 7-day average.'});
  }

    const r=glu7.filter(x=>x.ctx===ctx).slice(-1)[0];
    if(!r) return;
    const t=glucoseTier(ctx,r.v);

    flags.push({tier:t,title:'Glucose, latest '+CTX_LABEL[ctx]+' reading',text:'Your latest '+CTX_LABEL[ctx]+' reading of '+r.v+' mg/dL is above the usual reference range. This is a reading your doctor may want to review. '+DISC});
  });

  const short=sl.filter(r=>r.h<6).length;
  if(short>=3) flags.push({tier:'watch',title:'Sleep',text:'You logged under 6 hours of sleep on '+short+' of the last 7 nights. For awareness only. Please consult your doctor if this continues.'});

  }

  if(!last||now.getTime()-last>7*24*3600e3) flags.push({tier:'info',title:'Not enough recent data',text:'There are no readings from the last 7 days, so there is no pattern to show yet.'});

}

document.addEventListener('click',e=>{

  if(a==='clearSample'){['bp','glu','act','sleep','labs','plan'].forEach(k=>{S[k]=S[k].filter(x=>!x.sample);});save();render();toast('Sample data cleared.');return;}
  if(a==='askDelete'){S.ui.confirmDelete=true;render();return;}
  if(a==='cancelDelete'){S.ui.confirmDelete=false;render();return;}
  if(a==='deleteAll'){const keepLook=S.look;try{localStorage.removeItem(KEY);}catch(er){}S=seed();['bp','glu','act','sleep','labs','plan'].forEach(k=>{S[k]=[];});S.status={};S.look=keepLook;S.accepted=Date.now();save();render();toast('Everything was deleted from this browser.');return;}
  if(a==='delEntry'){const m={bp:'bp',glu:'glu',act:'act',sleep:'sleep'}[b.dataset.type];S[m]=S[m].filter(x=>x.id!==id);save();render();return;}
  if(a==='delLab'){S.labs=S.labs.filter(x=>x.id!==id);save();render();return;}
  if(a==='addCard'){const c=CARDS[id];if(!c||!c.plan)return;const it={id:nid(),kind:c.plan.kind,title:c.plan.title,time:c.plan.time,voice:'inherit',enabled:true,cardId:id};
    if(c.plan.inDays){const d=new Date();d.setDate(d.getDate()+c.plan.inDays);it.date=ymd(d);}
    S.plan.push(it);save();render();toast('Added to your plan.');return;}
  if(a==='seedPlan'){[['walk','Morning walk','06:30'],['meal','Breakfast','08:30'],['water','Have some water','11:00'],['meal','Lunch','13:30'],['walk','10-minute walk after lunch','14:00'],['check','Evening BP check','19:30'],['sleep','Bedtime wind-down','22:00']].forEach(x=>S.plan.push({id:nid(),kind:x[0],title:x[1],time:x[2],voice:'inherit',enabled:true}));save();render();return;}
  if(a==='done'||a==='skip'){S.status[todayStr()+':'+id]=a==='done'?'done':'skipped';save();render();toast(a==='done'?'Marked done. Nice work.':'Skipped. No problem.');return;}
  if(a==='undo'){delete S.status[todayStr()+':'+id];save();render();return;}
  if(a==='delItem'){S.plan=S.plan.filter(x=>x.id!==id);save();render();return;}
  if(a==='itemVoice'){const it=S.plan.find(x=>x.id===id);if(it){it.voice=({inherit:'on',on:'off',off:'inherit'})[it.voice]||'inherit';save();render();}return;}
  if(a==='askNotif'){
    try{
      if(!window.Notification){S.ui.notif='This browser does not offer notifications here.';render();return;}
      const r=Notification.requestPermission(); const done=p=>{S.ui.notif=p==='granted'?'Notifications are allowed.':'Notifications were not allowed.';render();};
      if(r&&r.then) r.then(done); else done(Notification.permission);
    }catch(er){S.ui.notif='Notifications are not available in this view.';render();}
    return;
  }
  if(a==='testReminder'){toast('Reminder coming in 10 seconds.');if(S.settings.voice)speak('');setTimeout(()=>{const it=planItemById('test');it.title='Test reminder';fire(it,0);},10000);return;}
  if(banner){
    const key=banner.dataset.key, n=Number(banner.dataset.n), it=planItemById(banner.dataset.item);
    clearTimeout(timers[key]); banner.remove(); try{speechSynthesis.cancel();}catch(er){}
    if(a==='bDone'){S.status[key]='done';save();render();toast('Marked done. Nice work.');}
    if(a==='bSkip'){S.status[key]='skipped';save();render();toast('Skipped. No problem.');}
    if(a==='bSnooze'){toast('Okay, I will remind you again in 10 minutes.');if(it)advance(it,n);}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.profile){S.profile[t.dataset.profile]=t.checked;save();render();return;}
  if(t.dataset&&t.dataset.setting){S.settings[t.dataset.setting]=t.checked;save();if(S.ui.tab==='plan'||S.ui.tab==='me')render();return;}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.name!==undefined){S.settings.name=e.target.value;save();}});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  const fd=Object.fromEntries(new FormData(f).entries()), kind=f.dataset.form, note=f.querySelector('[data-note]');
  const warn=msg=>{if(f.dataset.warned) return false;f.dataset.warned='1';if(note){note.textContent=msg;note.hidden=false;}return true;};
  if(kind==='bp'){
    const s=+fd.s,d=+fd.d; if(!(s>=60&&s<=260&&d>=30&&d<=160)){toast('Please enter a valid blood pressure.');return;}
    if(d>=s){toast('The top number should be higher than the bottom number.');return;}
    if((s>=200||d>=130||s<80)&&warn('That number is unusual. Please check it, then tap Save again.')) return;
    S.bp.push({id:nid(),ts:Date.now(),s,d,p:fd.p?+fd.p:null,ctx:fd.ctx}); save(); render(); toast('Saved.'); return;
  }
  if(kind==='glu'){
    const v=+fd.v; if(!(v>=20&&v<=600)){toast('Please enter a valid glucose value.');return;}
    if((v>=400||v<40)&&warn('That number is unusual. Please check it, then tap Save again.')) return;
    S.glu.push({id:nid(),ts:Date.now(),v,ctx:fd.ctx}); save(); render(); toast('Saved.'); return;
  }
  if(kind==='act'){const m=+fd.min;if(!(m>=1&&m<=600)){toast('Please enter minutes between 1 and 600.');return;}const d=todayStr();const ex=S.act.find(x=>x.date===d&&!x.sample);if(ex)ex.min+=m;else S.act.push({id:nid(),date:d,min:m});save();render();toast('Added.');return;}
  if(kind==='sleep'){const h=+fd.h;if(!(h>=0&&h<=16)){toast('Please enter hours between 0 and 16.');return;}const d=todayStr();S.sleep=S.sleep.filter(x=>x.date!==d);S.sleep.push({id:nid(),date:d,h});save();render();toast('Saved.');return;}
  if(kind==='lab'){const v=+fd.value;if(isNaN(v)||v<=0){toast('Please enter the value from your report.');return;}S.labs.push({id:nid(),key:fd.key,value:v,date:fd.date,lab:fd.lab||'',refLo:fd.refLo,refHi:fd.refHi});save();render();toast('Result saved.');return;}
  if(kind==='plan'){S.plan.push({id:nid(),kind:fd.kind,title:fd.title.trim(),time:fd.time,voice:'inherit',enabled:true});save();render();toast('Added to your plan.');return;}
  if(kind==='idrs'){S.ui.idrs=idrs(fd);save();render();return;}
});
setInterval(()=>{const now=new Date();document.querySelectorAll('[data-countdown]').forEach(el=>{el.textContent=fmtIn(new Date(Number(el.dataset.countdown)),now);});},15000);

try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({}));}catch(e){}
render();
})();
</script>

</body>
